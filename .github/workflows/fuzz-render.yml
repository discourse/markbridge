name: Fuzz the renderer

on:
  schedule:
    # Every night at 03:00 UTC.
    - cron: '0 3 * * *'
  workflow_dispatch:

# The adjacency spec in CI runs a sample of the inline pairs. This job
# runs every pair and more structure seeds with bin/fuzz-render, and
# uploads the shrunk failure reports when a case fails.
jobs:
  fuzz-render:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/support/markdown_it/package-lock.json

      - name: Install markdown-it
        run: npm ci --prefix spec/support/markdown_it

      - name: Run the round-trip checks
        env:
          MARKDOWN_IT_REQUIRED: '1'
        run: bin/fuzz-render --seeds 3000 --output tmp/fuzz-render

      - name: Upload the failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-render
          path: tmp/fuzz-render/
          retention-days: 14
