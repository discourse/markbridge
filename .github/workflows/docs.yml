name: Deploy docs to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'lib/markbridge/version.rb'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'lib/markbridge/version.rb'
      - '.github/workflows/docs.yml'
  # The changelog page is built from the GitHub releases. A release
  # event cannot deploy: its run belongs to the tag, and the Pages
  # environment lets only main deploy. So the publish job of main.yml
  # starts this workflow on main after it has created a release. After
  # an edit of release notes, start it by hand.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref so a PR build never queues behind (or blocks) a main deploy.
# Cancel superseded PR builds; never cancel an in-flight deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: ./docs
          # Astro requires Node 22.12 or newer.
          node-version: 22
          # pnpm version comes from the "packageManager" field in
          # docs/package.json — passing it here too makes pnpm/action-setup
          # error with "Multiple versions of pnpm specified".

  deploy:
    needs: build
    # PRs validate the build only; deploy happens on push to main and
    # when the workflow is started on main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
