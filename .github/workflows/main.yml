name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Check Ruby formatting with Syntax Tree
        run: bundle exec stree check Gemfile Rakefile *.gemspec "lib/**/*.rb" "spec/**/*.rb"

  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
          # `jruby` is the latest release (10.1.x, Ruby 4.0). `jruby-10.0` is
          # the LTS line, it targets Ruby 3.4 and is supported until 2028.
          - 'jruby-10.0'
          - 'jruby'
          - 'truffleruby'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # The specs cook the Markdown with markdown-it. JRuby skips
      # those specs, its Nokogiri has no HTML5 parser.
      - name: Set up Node
        if: ${{ !startsWith(matrix.ruby, 'jruby') }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec/support/markdown_it/package-lock.json
      - name: Install markdown-it
        if: ${{ !startsWith(matrix.ruby, 'jruby') }}
        run: npm ci --prefix spec/support/markdown_it
      - name: Run tests
        env:
          MARKDOWN_IT_REQUIRED: ${{ startsWith(matrix.ruby, 'jruby') && '0' || '1' }}
        run: bundle exec rake spec

  # Random BBCode, read by Markbridge and by s9e\TextFormatter (see
  # bin/fuzz-parse). The comparison takes a second and gives the same
  # result on every run, so it runs for every push. The other half of
  # bin/fuzz-parse measures time and stays in the nightly workflow: a
  # busy runner must not fail a pull request.
  s9e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, xsl
          tools: composer

      - name: Fetch s9e\TextFormatter
        run: bin/s9e-setup

      - name: Compare with s9e
        run: bin/fuzz-parse --only s9e --seeds 1000 --output tmp/fuzz-parse

      - name: Upload the failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-parse
          path: tmp/fuzz-parse/
          retention-days: 14

  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    # No Node here on purpose: the specs that cook with markdown-it are
    # pending, so the unit specs have to kill every mutation on their
    # own. With markdown-it present the coverage map selects thousands
    # of round-trip examples for a renderer subject, a mutation they do
    # not kill runs into the timeout, and mutant counts a timeout as a
    # kill.

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `--since` walks git history; default shallow clone hides the base.
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # mutant.yml selects a subject's tests from this recording.
      - name: Record per-test coverage
        run: COVERAGE=1 bundle exec rspec

      # On PR: mutate subjects changed since main.
      # On push to main: mutate subjects changed by this push.
      - name: Run mutant
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            since="origin/main"
          else
            since="${{ github.event.before }}"
            # A force-push leaves `github.event.before` pointing to an
            # unreachable commit; fall back to the previous commit on main.
            if ! git cat-file -e "${since}^{commit}" 2>/dev/null; then
              echo "Base ${since} not reachable; falling back to HEAD^"
              since="HEAD^"
            fi
          fi
          bin/mutant run --since "${since}"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - lint
      - test
      - mutation

    runs-on: ubuntu-latest

    permissions:
      contents: write
      # To start the docs workflow after the release, see below.
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # bin/generate-release-notes needs prior tags and the commits
          # between them to build the changelog.
          fetch-depth: 0
      - name: Release Gem
        uses: discourse/publish-rubygems-action@v3
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GIT_EMAIL: team@discourse.org
          GIT_NAME: discoursebot
      - name: Create GitHub Release
        run: |
          VERSION=$(ruby -r ./lib/markbridge/version -e 'puts Markbridge::VERSION')
          TAG="v${VERSION}"
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            NOTES=$(bin/generate-release-notes)
            gh release create "${TAG}" --notes "${NOTES}" --latest
            # The changelog page of the docs is built from the releases.
            # The docs build for the version bump ran before this one
            # existed, so build the docs again, from main.
            gh workflow run docs.yml --ref main
          else
            echo "Release ${TAG} already exists, skipping."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
