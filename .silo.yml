# silo project configuration
# https://github.com/gschlager/silo#project-configuration

image: fedora/45

# Installs rv (MRI) and ruby-install (jruby/truffleruby), the listed Ruby
# versions, pins the default, and wires up the shell. Replaces the manual
# toolchain setup we used to copy-paste here.
use:
  ruby:
    versions: [3.3, 3.4, "4.0", jruby, truffleruby]
    default: "4.0"

setup:
  - sudo dnf update -y
  # Node + pnpm for the docs site (Astro/Starlight); both ship as Fedora packages.
  # Node 24, because Astro needs a newer Node 22 than Fedora has. The -bin
  # packages make it `node` and `npm`, --allowerasing replaces the ones of
  # Node 22 when a silo already has them.
  - sudo dnf install -y --allowerasing nodejs24 nodejs24-bin nodejs24-npm-bin pnpm
  # PHP and composer to run s9e\TextFormatter, which writes the fixture of
  # the s9e reference spec (spec/support/s9e/generate.php).
  - sudo dnf install -y php-cli php-xml php-mbstring composer
  # Every engine needs its own gems. A plain `bundle install` only serves
  # the default one, and the others then fall back to its gems or fail.
  # Keep this list the same as `use.ruby.versions` above.
  - for engine in 3.3 3.4 "4.0" jruby truffleruby; do bin/with-ruby "$engine" bundle install; done
  - bundle exec lefthook install -f
  - (cd docs && CI=true pnpm install)
  # markdown-it for the cooked-output specs, without it they are skipped.
  # The second package builds Discourse's own engine (bin/discourse-engine,
  # a manual step: it fetches parts of Discourse).
  - npm ci --prefix spec/support/markdown_it
  - npm ci --prefix spec/support/discourse_engine

sync:
  - for engine in 3.3 3.4 "4.0" jruby truffleruby; do bin/with-ruby "$engine" bundle install; done
  - (cd docs && CI=true pnpm install)
  - npm ci --prefix spec/support/markdown_it
  - npm ci --prefix spec/support/discourse_engine

update:
  - sudo dnf update -y
  - rv self update

# `http: true` marks a port as a web server, so `silo status --json` reports
# a URL for it.
daemons:
  playground:
    cmd: bin/playground
    ports:
      - port: "4567"
        http: true
    autostart: true
  docs:
    cmd: bin/docs
    ports:
      - port: "4321"
        http: true
    autostart: true
